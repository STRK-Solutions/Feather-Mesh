[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feam"
version = "0.1.0"
description = "Supported Feather Mesh peer-data access SDK"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
table = ["polars>=1.0"]
raster = ["rasterio>=1.3", "pystac-client>=0.8"]
test = ["pytest>=8", "pyarrow>=16", "polars>=1.0", "rasterio>=1.3", "pystac-client>=0.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
