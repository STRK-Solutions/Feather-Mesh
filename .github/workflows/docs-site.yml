name: Documentation site

on:
  push:
    branches: ["main"]
    paths:
      - "demo_site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "demo_site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: python -m pip install -r demo_site/requirements.txt

      - name: Build static documentation site
        run: python -m mkdocs build --strict --config-file demo_site/mkdocs.yml

      - uses: actions/upload-artifact@v4
        with:
          name: feather-mesh-doc-site
          path: demo_site/site/
          if-no-files-found: error
          retention-days: 14
