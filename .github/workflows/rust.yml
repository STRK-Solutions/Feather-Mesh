name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: feather-mesh

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Build
      run: cargo build --verbose

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run Clippy
      run: cargo clippy -- -D warnings
      
    - name: Run tests
      run: cargo test --verbose

    - name: Verify Stage-1 CLI-only build
      run: cargo test -p mesh_cli --no-default-features

    - name: Verify Stage-1 manual TUI build
      run: cargo test -p mesh_cli --no-default-features --features tui

    - name: Verify Stage-1 hosted-agent build without live traffic
      run: cargo test -p mesh_cli --no-default-features --features agent-hosted

    - name: Run all Stage-1 feature tests offline
      run: cargo test --workspace --all-features

    - name: Lint all Stage-1 feature combinations
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check router model screening offline
      run: python -m unittest discover -s scripts -p test_router_model_screen.py

  peer-adapters:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: feather-mesh
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Build the CLI used by the installed SDK
      run: cargo build -p mesh_cli --features agent-hosted
    - name: Build terminal lifecycle and offline acceptance drivers
      run: |
        cargo build -p mesh_tui --features test-driver --example terminal_probe
        cargo build -p mesh_agent --all-features --example stage1_eval
    - name: Install the SDK with table, raster, and STAC test dependencies
      run: python -m pip install ./python_sdk[test] -r scripts/stage1-test-requirements.txt
    - name: Generate reproducible peer-access fixtures
      run: python mesh_core/tests/data/peer_access/generate_fixtures.py
    - name: Verify fresh installed SDK import outside its source tree
      run: cd /tmp && python -c "import feam; print(feam.Project)"
    - name: Run real CLI, Polars, Rasterio, and pystac-client integration tests
      env:
        FEAM_E2E: '1'
        FEAM_EXECUTABLE: ${{ github.workspace }}/feather-mesh/target/debug/mesh_cli
      run: python -m pytest python_sdk/tests

    - name: Exercise terminal restoration and offline TUI workflows
      run: |
        python -m unittest discover -s scripts -p test_tui_pty.py
        python -m unittest discover -s scripts -p test_demo_reset.py
        python scripts/tui_walkthrough.py --mode manual --output /tmp/feam-manual.json
        python scripts/tui_walkthrough.py --mode fake --output /tmp/feam-fake.json
        target/debug/examples/stage1_eval --fake --output /tmp/feam-offline-evaluation.json
        target/debug/examples/stage1_eval --fake --corpus mesh_agent/evaluations/held-out-v3.1.json --output /tmp/feam-heldout-fixtures.json
