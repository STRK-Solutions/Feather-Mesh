name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: feather-mesh

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust components
      run: rustup component add rustfmt clippy
    
    - name: Build
      run: cargo build --verbose

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run Clippy
      run: cargo clippy -- -D warnings
      
    - name: Run tests
      run: cargo test --verbose

  peer-adapters:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: feather-mesh
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: dtolnay/rust-toolchain@stable
    - name: Build the CLI used by the installed SDK
      run: cargo build --bin mesh_cli
    - name: Install the SDK with table, raster, and STAC test dependencies
      run: python -m pip install ./python_sdk[test]
    - name: Generate reproducible peer-access fixtures
      run: python mesh_core/tests/data/peer_access/generate_fixtures.py
    - name: Verify fresh installed SDK import outside its source tree
      run: cd /tmp && python -c "import feam; print(feam.Project)"
    - name: Run real CLI, Polars, Rasterio, and pystac-client integration tests
      env:
        FEAM_E2E: '1'
        FEAM_EXECUTABLE: ${{ github.workspace }}/feather-mesh/target/debug/mesh_cli
      run: python -m pytest python_sdk/tests
