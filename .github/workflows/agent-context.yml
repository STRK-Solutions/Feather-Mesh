name: Agent context

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install context checker dependency
        run: python -m pip install -r .codex/skills/feam-agent-context-maintainer/scripts/requirements.txt
      - name: Check repository context structure
        run: bash .codex/skills/feam-agent-context-maintainer/scripts/check_agents_context.sh
      - name: Test context checker regressions
        run: python .codex/skills/feam-agent-context-maintainer/scripts/test_check_agents_context.py
