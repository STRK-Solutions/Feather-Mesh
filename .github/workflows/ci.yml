name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cache
      - name: Build terminal_probe example for PTY tests
        run: |
          cargo build -p mesh_tui --features test-driver --example terminal_probe

      - name: Install Python for PTY scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for PTY tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/stage1-test-requirements.txt

      - name: Run Rust tests and PTY acceptance scripts
        env:
          FEAM_TERMINAL_PROBE: ${{ github.workspace }}/feather-mesh/target/debug/examples/terminal_probe
          FEAM_EXECUTABLE: ${{ github.workspace }}/feather-mesh/target/debug/mesh_cli
        run: |
          # Run unit tests across workspace first
          cargo test --workspace --all-features --verbose

          # Run PTY Python unit tests (terminal restore and walkthrough)
          python -m unittest discover -s scripts -p test_tui_pty.py
          python scripts/tui_walkthrough.py --mode fake --output /tmp/feam-fake.json
