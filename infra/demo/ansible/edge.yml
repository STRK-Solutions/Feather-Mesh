---
- name: Install the reviewed FEAM connector without implicit public activation
  hosts: demo
  become: true
  gather_facts: true
  gather_subset: [min]
  vars:
    feam_edge_start: false
    feam_edge_enable: false
    feam_edge_activate: false
    feam_edge_stop: false
    feam_edge_account_id: ''
    feam_edge_tunnel_id: ''
    feam_edge_readiness_sha256: ''
    # Host-local private file, never a token in variables or arguments.
    feam_edge_token_source: ''
  roles:
    - edge
