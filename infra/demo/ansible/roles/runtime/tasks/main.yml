---
- name: Create dedicated runner user unit directory
  ansible.builtin.file:
    path: '{{ feam_root }}/runner-home/.config/systemd/user'
    state: directory
    owner: feam-runner
    group: feam-runner
    mode: '0700'

- name: Install rootless daemon as a user service
  ansible.builtin.template:
    src: docker.service.j2
    dest: '{{ feam_root }}/runner-home/.config/systemd/user/docker.service'
    owner: feam-runner
    group: feam-runner
    mode: '0600'
  register: runtime_daemon_unit

- name: Create the runner-only system manager override
  ansible.builtin.file:
    path: /etc/systemd/system/user@2101.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bind runner manager to verified system mounts and recreate socket ACLs
  ansible.builtin.template:
    src: manager.conf.j2
    dest: /etc/systemd/system/user@2101.service.d/feam.conf
    owner: root
    group: root
    mode: '0644'
  register: runtime_manager_unit

- name: Create aggregate runner slice override
  ansible.builtin.file:
    path: /etc/systemd/system/user-2101.slice.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bound aggregate runner resource use
  ansible.builtin.copy:
    dest: /etc/systemd/system/user-2101.slice.d/feam.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Slice]
      MemoryMax={{ feam_runner_memory_max | default('1536M') }}
      MemorySwapMax=0
      CPUQuota={{ feam_runner_cpu_quota | default('200%') }}
      TasksMax={{ feam_runner_tasks_max | default(512) }}
  register: runtime_slice_unit

- name: Load system manager prerequisites
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: runtime_manager_unit.changed or runtime_slice_unit.changed

- name: Apply changed runner slice limits live without restarting the manager
  ansible.builtin.command:
    argv:
      - systemctl
      - set-property
      - --runtime
      - user-2101.slice
      - 'MemoryMax={{ feam_runner_memory_max | default("1536M") }}'
      - MemorySwapMax=0
      - 'CPUQuota={{ feam_runner_cpu_quota | default("200%") }}'
      - 'TasksMax={{ feam_runner_tasks_max | default(512) }}'
  # This must precede the live daemon checks; a deferred handler runs too late.
  when: runtime_slice_unit.changed # noqa: no-handler
  changed_when: true

- name: Inspect runner registration in logind rather than only the linger file
  ansible.builtin.command:
    argv: [loginctl, show-user, feam-runner, --property=Linger, --value]
  register: runtime_linger
  failed_when: false
  changed_when: false
  check_mode: false

- name: Enable or repair lingering for the dedicated runner only
  ansible.builtin.command:
    argv: [loginctl, enable-linger, feam-runner]
  when: runtime_linger.rc != 0 or runtime_linger.stdout != 'yes'
  changed_when: true

- name: Start the mount-bound user manager without a login
  ansible.builtin.systemd_service:
    name: user@2101.service
    state: started

- name: Verify live lingering registration
  ansible.builtin.command:
    argv: [loginctl, show-user, feam-runner, --property=Linger, --value]
  register: runtime_linger_verified
  changed_when: false
  check_mode: false
  failed_when: runtime_linger_verified.rc != 0 or runtime_linger_verified.stdout != 'yes'

- name: Reload the dedicated user manager only when its daemon unit changed
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/2101/bus',
           /usr/bin/systemctl, --user, daemon-reload]
  # The following enablement and liveness checks require the current unit now.
  when: runtime_daemon_unit.changed # noqa: no-handler
  changed_when: true

- name: Inspect dedicated user daemon enablement
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/2101/bus',
           /usr/bin/systemctl, --user, is-enabled, docker.service]
  register: runtime_docker_enabled
  changed_when: false
  check_mode: false
  failed_when: runtime_docker_enabled.rc not in [0, 1]

- name: Enable the dedicated user daemon without restarting it
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/2101/bus',
           /usr/bin/systemctl, --user, enable, docker.service]
  when: runtime_docker_enabled.stdout != 'enabled'
  changed_when: true

- name: Inspect dedicated user daemon activity
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/2101/bus',
           /usr/bin/systemctl, --user, show, docker.service, --property=ActiveState, --value]
  register: runtime_docker_activity
  changed_when: false
  check_mode: false
  failed_when: runtime_docker_activity.rc != 0 or runtime_docker_activity.stdout not in ['active', 'inactive']

- name: Start the dedicated user daemon only when inactive
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/2101/bus',
           /usr/bin/systemctl, --user, start, docker.service]
  when: runtime_docker_activity.stdout == 'inactive'
  changed_when: true

- name: Verify rootless systemd cgroup support
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, feam-runner, --, /usr/bin/env,
           'XDG_RUNTIME_DIR=/run/user/2101', 'DOCKER_HOST=unix:///run/user/2101/feam-docker.sock',
           /usr/bin/docker, info, --format, '{{ "{{json .}}" }}']
  register: runtime_docker_info
  changed_when: false
  check_mode: false

- name: Reject ignored limits or a wrong runtime data root
  ansible.builtin.assert:
    that:
      - (runtime_docker_info.stdout | from_json).CgroupDriver == 'systemd'
      - (runtime_docker_info.stdout | from_json).CgroupVersion == '2'
      - (runtime_docker_info.stdout | from_json).DockerRootDir == feam_root + '/runtime/docker'
      - "'name=rootless' in (runtime_docker_info.stdout | from_json).SecurityOptions"
      - "'name=seccomp,profile=builtin' in (runtime_docker_info.stdout | from_json).SecurityOptions"
