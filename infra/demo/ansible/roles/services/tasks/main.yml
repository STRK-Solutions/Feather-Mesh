---
- name: Require exact reviewed artifacts and the private SSH operator
  ansible.builtin.assert:
    that:
      - feam_image_id is match('^sha256:[0-9a-f]{64}$')
      - feam_proxy_sha256 is match('^[0-9a-f]{64}$')
      - feam_operator_uid | int >= 1000
      - feam_operator_uid | int not in range(2101, 2108)
      - feam_parent_uuid is match('^[a-f0-9-]{36}$')

- name: Verify the supplied native proxy before installation
  ansible.builtin.stat:
    path: '{{ feam_proxy_source }}'
    checksum_algorithm: sha256
  register: services_proxy

- name: Reject a changed native service artifact
  ansible.builtin.assert:
    that:
      - services_proxy.stat.isreg
      - services_proxy.stat.checksum == feam_proxy_sha256

- name: Create root-owned release and configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: [/opt/feam-w1, /etc/feam, /opt/feam-w1-tests]

- name: Install the verified native proxy
  ansible.builtin.copy:
    src: '{{ feam_proxy_source }}'
    remote_src: true
    dest: /opt/feam-w1/private-terminal
    owner: root
    group: root
    mode: '0755'

- name: Install fixed operator lifecycle and ACL helpers
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../scripts/{{ item.src }}'
    dest: '/usr/local/sbin/{{ item.dest }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - {src: w1_terminal.py, dest: feam-w1-terminal}
    - {src: w1_proxy_acl.py, dest: feam-w1-proxy-acl}

- name: Install bounded private-slice acceptance probes
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../tests/w1/{{ item }}'
    dest: '/opt/feam-w1-tests/{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop: [acceptance.sh, container_probe.py, image_walkthrough.py, socket_probe.py]

- name: Record the approved immutable terminal image and filesystem
  ansible.builtin.copy:
    dest: /etc/feam/w1-terminal.json
    content: '{{ {"image_id": feam_image_id, "parent_uuid": feam_parent_uuid} | to_nice_json }}'
    owner: root
    group: root
    mode: '0600'

- name: Record the existing SSH operator for frontend socket ACLs
  ansible.builtin.copy:
    dest: /etc/feam/w1-proxy-operator.json
    content: '{{ {"operator_uid": feam_operator_uid | int} | to_nice_json }}'
    owner: root
    group: root
    mode: '0600'

- name: Generate one private operator credential if absent
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os,secrets;
        p='{{ feam_root }}/gateway-home/w1-credential';
        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);
        os.write(fd,(secrets.token_hex(32)+'\n').encode());os.fsync(fd);os.fchown(fd,2102,2102);os.close(fd)
    creates: '{{ feam_root }}/gateway-home/w1-credential'
  no_log: true

- name: Install the private gateway systemd unit
  ansible.builtin.template:
    src: private-terminal.service.j2
    dest: /etc/systemd/system/feam-w1-private-terminal.service
    owner: root
    group: root
    mode: '0644'
  register: services_unit

- name: Explicitly initialize only an empty unassigned W1 slice
  ansible.builtin.command:
    argv: [/usr/local/sbin/feam-w1-terminal, initialize]
    creates: '{{ feam_root }}/w1-terminal-state.json'

- name: Start the fixed private slot
  ansible.builtin.command:
    argv: [/usr/local/sbin/feam-w1-terminal, start]
  changed_when: false

- name: Start private proxy with no public listener
  ansible.builtin.systemd_service:
    daemon_reload: '{{ services_unit.changed }}'
    name: feam-w1-private-terminal.service
    enabled: true
    state: started
